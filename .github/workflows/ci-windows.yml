# Windows CI: cross-build the CPU path with MinGW-w64 (POSIX threads, static
# link, cmake/toolchains/x86_64-w64-mingw32.cmake) on a Linux runner, run the
# tests under Wine, and pack a test bundle that runs on a plain Windows
# machine (tools/make_test_bundle.py). A native MSVC build is not supported.
#
# Under Wine, some tests have failed in earlier local runs (the stack-size
# regression test, the Python-driven conformance tests and the device-math
# test), so the test step does not fail the job yet: it records the result in
# the log and the scoreboard. Remove `continue-on-error` once a clean Wine run
# is confirmed.
#
# Runs on pushes to main and on pull requests (not for changes to Markdown,
# cards or docs only), and by hand; a newer push cancels the run before it.
name: ci-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "cards/**", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "cards/**", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mingw-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 mingw-w64 wine64
      - name: Configure
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-w64-mingw32.cmake
      - name: Build
        run: cmake --build build-win -j4
      - name: Test under Wine
        continue-on-error: true
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wine
        run: ctest --test-dir build-win --output-on-failure | tee ctest.txt
      - name: Test bundle for a Windows machine
        run: python3 tools/make_test_bundle.py build-win ocu-windows-tests.zip
      - name: Scoreboard
        if: always()
        run: |
          python3 tools/scoreboard.py --ctest cpu=ctest.txt --out-dir scoreboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            ocu-windows-tests.zip
            scoreboard/
