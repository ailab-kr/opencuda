# macOS CI: build and test on Apple silicon. Hosted runners may have no GPU
# available to Metal; tests that need a device skip themselves, so a green run
# here proves the build, the CPU backend and the translator host checks, not
# GPU execution. GPU runs are done on real Macs (see cards/backend).
#
# Runs on pushes to main and on pull requests (not for changes to Markdown,
# cards or docs only), and by hand; a newer push cancels the run before it.
name: ci-macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "cards/**", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "cards/**", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install cmake ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings are failures)
        run: |
          cmake --build build -j4 2>&1 | tee build.log
          if grep -E 'warning:' build.log; then exit 1; fi
      - name: Test
        run: ctest --test-dir build --output-on-failure | tee ctest.txt
      - name: Harness and scoreboard tests
        run: |
          (cd conformance/harness && python3 -m unittest discover -s tests)
          python3 -m unittest discover -s tools/tests
      - name: Scoreboard
        run: |
          python3 tools/scoreboard.py build/tests/blas_cpu_result.json \
            --ctest cpu=ctest.txt --out-dir scoreboard
      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-macos
          path: scoreboard/
  sanitizers:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install cmake ninja
      - name: Address and undefined-behaviour sanitizers
        # Apple's address sanitizer has no leak detection (as in tools/check.sh).
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build-san -j4
          ctest --test-dir build-san --output-on-failure
