<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>OpenCuda overview: applications on top, a compatibility layer, the three core parts, and chips at the bottom</title>
  <rect width="960" height="470" fill="#ffffff"/>
  <!-- applications -->
  <g>
    <rect x="40" y="20" width="880" height="62" rx="10" fill="#f4f6f8" stroke="#c9d1d9"/>
    <text x="60" y="47" font-size="15" font-weight="600" fill="#24292f">Unmodified CUDA C++ applications</text>
    <text x="60" y="68" font-size="13" fill="#57606a">llama.cpp · Rodinia benchmarks · your CMake or Makefile project</text>
  </g>
  <!-- compatibility layer -->
  <g>
    <rect x="40" y="96" width="880" height="62" rx="10" fill="#eaf2fb" stroke="#8fb4dd"/>
    <text x="60" y="123" font-size="15" font-weight="600" fill="#1f4f82">Compatibility layer: the vehicle</text>
    <text x="60" y="144" font-size="13" fill="#3d5f85">runtime API and headers · BLAS-compatible library · CUB subset · nvcc-compatible driver · CMake toolkit</text>
  </g>
  <!-- three core parts -->
  <g>
    <rect x="40" y="172" width="284" height="132" rx="10" fill="#e8f5ee" stroke="#7cc29b" stroke-width="2"/>
    <text x="58" y="200" font-size="15" font-weight="700" fill="#1d6b43">1 · Executable reference</text>
    <text x="58" y="224" font-size="13" fill="#2f5d45">written from public docs only</text>
    <text x="58" y="244" font-size="13" fill="#2f5d45">deterministic, runs on any CPU</text>
    <text x="58" y="264" font-size="13" fill="#2f5d45">exact fma, verified math library</text>
    <text x="58" y="284" font-size="13" fill="#2f5d45">“what correct means”, as code</text>

    <rect x="338" y="172" width="284" height="132" rx="10" fill="#e8f5ee" stroke="#7cc29b" stroke-width="2"/>
    <text x="356" y="200" font-size="15" font-weight="700" fill="#1d6b43">2 · Conformance suite</text>
    <text x="356" y="224" font-size="13" fill="#2f5d45">levels L1 build … L5 applications</text>
    <text x="356" y="244" font-size="13" fill="#2f5d45">exact answers, stated tolerances</text>
    <text x="356" y="264" font-size="13" fill="#2f5d45">mutants prove the tests bite</text>
    <text x="356" y="284" font-size="13" fill="#2f5d45">result records → scoreboard</text>

    <rect x="636" y="172" width="284" height="132" rx="10" fill="#e8f5ee" stroke="#7cc29b" stroke-width="2"/>
    <text x="654" y="200" font-size="15" font-weight="700" fill="#1d6b43">3 · Thin backend contract</text>
    <text x="654" y="224" font-size="13" fill="#2f5d45">one small C interface (SIMT chips)</text>
    <text x="654" y="244" font-size="13" fill="#2f5d45">operator table (NPUs)</text>
    <text x="654" y="264" font-size="13" fill="#2f5d45">plug in a chip, change nothing</text>
    <text x="654" y="284" font-size="13" fill="#2f5d45">above it</text>
  </g>
  <!-- arrows -->
  <g stroke="#8c959f" stroke-width="2" fill="none">
    <path d="M182 304 v26"/><path d="M480 304 v26"/><path d="M778 304 v26"/>
  </g>
  <!-- chips -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="40"  y="332" width="160" height="56" rx="10" fill="#fff8e6" stroke="#e0b34c"/><text x="120" y="365" fill="#7a5a0b">CPU (x86-64, ARM64)</text>
    <rect x="216" y="332" width="160" height="56" rx="10" fill="#fff8e6" stroke="#e0b34c"/><text x="296" y="365" fill="#7a5a0b">NVIDIA GPU</text>
    <rect x="392" y="332" width="160" height="56" rx="10" fill="#fff8e6" stroke="#e0b34c"/><text x="472" y="365" fill="#7a5a0b">Apple GPU (Metal)</text>
    <rect x="568" y="332" width="160" height="56" rx="10" fill="#fff8e6" stroke="#e0b34c"/><text x="648" y="365" fill="#7a5a0b">OpenCL devices</text>
    <rect x="744" y="332" width="176" height="56" rx="10" fill="#fdf0f0" stroke="#d98b8b" stroke-dasharray="5 4"/><text x="832" y="358" fill="#8a3b3b">NPUs · AMD · Intel</text><text x="832" y="377" font-size="12" font-weight="400" fill="#8a3b3b">next</text>
  </g>
  <text x="480" y="430" font-size="13" text-anchor="middle" fill="#57606a">Green: the core of the project. Blue: what you use today. Yellow: chips with working backends.</text>
</svg>
